apiVersion: apps/v1
kind: Deployment
metadata:
  name: module-14
spec:
  selector:
    matchLabels:
      app: module-14
  replicas: 1
  template:
    metadata:
      labels:
        app: module-14
    spec:
      containers:
        - name: "todo-app"
          image: "todo-app:prod"
          ports:
            - containerPort: 8000
          imagePullPolicy: "Never"
          envFrom:
            - secretRef:
                name: container-env
